<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G‘uzor Ads — Instagram profil maketi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#000;color:#f5f5f5;font-size:14px;max-width:430px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;font-size:20px}
.bar span{font-size:14px;font-weight:400;color:#a8a8a8}
.head{display:flex;align-items:center;gap:26px;padding:4px 16px 12px}
.avatar{width:86px;height:86px;border-radius:50%;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%}
.counts{display:flex;flex:1;justify-content:space-around;text-align:center}
.counts b{display:block;font-size:17px}
.bio{padding:0 16px;line-height:1.38;white-space:pre-line}
.bio .name{font-weight:700}
.bio .cat{color:#a8a8a8}
.bio a{color:#e0f1ff;font-weight:600;text-decoration:none}
.btns{display:flex;gap:6px;padding:14px 16px}
.btns div{flex:1;text-align:center;background:#262626;border-radius:8px;padding:7px 0;font-weight:600}
.btns div.blue{background:#0095f6}
.hls{display:flex;gap:14px;padding:6px 16px 14px;overflow:hidden}
.hl{text-align:center;font-size:12px;flex:none;width:66px}
.hl img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #000;outline:1px solid #3a3a3a}
.tabs{display:flex;border-top:1px solid #262626}
.tabs div{flex:1;text-align:center;padding:10px 0;color:#a8a8a8}
.tabs div.on{color:#fff;border-bottom:1px solid #fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
</style>
</head>
<body>
<div class="bar">guzorads <span>⋯</span></div>
<div class="head">
  <div class="avatar"><img src="export/logo-avatar.png" alt="G‘uzor Ads logo"></div>
  <div class="counts"><div><b>9</b>posts</div><div><b>1 250</b>followers</div><div><b>180</b>following</div></div>
</div>
<div class="bio"><span class="name">G‘uzor Ads | SMM · Target · Dizayn</span>
<span class="cat">Marketing agency</span>
🚀 Biznesingizni raqamli dunyoda rivojlantiramiz
📱 SMM · 🎯 Target · 🎬 Reels · 🎨 Dizayn
📍 G‘uzor · Butun O‘zbekiston bo‘ylab
🎁 Bepul maslahat 👇
<a href="https://t.me/GuzorAds">🔗 t.me/GuzorAds</a></div>
<div class="btns"><div class="blue">Follow</div><div>Message</div><div>Contact</div></div>
<div class="hls" id="hls"></div>
<div class="tabs"><div class="on">▦</div><div>▶</div><div>☺</div></div>
<div class="grid" id="grid"></div>
<script>
const H = [['xizmatlar','Xizmatlar'],['paketlar','Paketlar'],['ishlar','Ishlarimiz'],['natija','Natijalar'],['fikrlar','Fikrlar'],['jarayon','Jarayon'],['savollar','Savollar'],['aloqa','Aloqa']];
document.getElementById('hls').innerHTML = H.map(([f,t]) => `<div class="hl"><img src="export/highlights/${f}.png" alt="">${t}</div>`).join('');
// Newest first: post-9 is the latest; post-1..3 are the pinned trio shown on top
const order = [1,2,3,9,8,7,6,5,4];
document.getElementById('grid').innerHTML = order.map(n => `<img src="export/posts/post-${n}.png" alt="">`).join('');
</script>
</body>
</html>
